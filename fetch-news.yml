name: Daily AI News Refresh

on:
  schedule:
    # 06:00 UTC = 06:00 Iceland time (Iceland is UTC+0 year-round, no DST)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allows manual trigger from the GitHub Actions tab for testing

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to commit updated app.js back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Fetch and inject news
        run: node scripts/fetch-news.js

      - name: Commit updated app.js
        run: |
          git config user.name  "tilma-bot"
          git config user.email "bot@tilma-ai"
          git add app.js
          # Only commit if app.js actually changed — skips on dry runs with no new stories
          git diff --staged --quiet || git commit -m "🤖 Daily news refresh — $(date +'%B %-d, %Y')"
          git push
