<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tilma AI</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- SPLASH / NAV PAGE -->
  <div id="splash" class="page active">
    <header class="site-header">
      <div class="logo">TILMA<span>AI</span></div>
      <p class="tagline">Your field guide to AI-assisted coding</p>
    </header>

    <nav class="paint-nav">
      <div class="paint-panel" id="nav-prompt" data-section="prompt">
        <div class="panel-inner">
          <div class="panel-number">01</div>
          <div class="panel-label">Prompt<br/>Engineering</div>
          <div class="panel-arrow">→</div>
          <div class="panel-desc">Craft better inputs.<br/>Get better outputs.</div>
        </div>
        <div class="panel-swipe"></div>
      </div>

      <div class="paint-panel featured" id="nav-coding" data-section="coding">
        <div class="panel-inner">
          <div class="panel-number">02</div>
          <div class="panel-label">AI<br/>Coding</div>
          <div class="panel-arrow">→</div>
          <div class="panel-desc">Workflows, tools &amp;<br/>power moves.</div>
        </div>
        <div class="panel-swipe"></div>
      </div>

      <div class="paint-panel" id="nav-news" data-section="news">
        <div class="panel-inner">
          <div class="panel-number">03</div>
          <div class="panel-label">AI<br/>News</div>
          <div class="panel-arrow">→</div>
          <div class="panel-desc">Latest from the<br/>frontier.</div>
        </div>
        <div class="panel-swipe"></div>
      </div>
    </nav>

    <footer class="site-footer">
      <span>TILMA AI — Field Notes</span>
    </footer>
  </div>

  <!-- SECTION PAGE -->
  <div id="section-page" class="page">
    <div class="section-header">
      <button class="back-btn" id="back-btn">← TILMA AI</button>
      <div class="section-title-wrap">
        <span class="section-num" id="section-num"></span>
        <h1 class="section-title" id="section-title"></h1>
      </div>
      <button class="add-post-btn" id="add-post-btn">+ New Post</button>
    </div>

    <div class="posts-grid" id="posts-grid">
      <!-- Posts injected here -->
    </div>

    <div class="empty-state" id="empty-state" style="display:none">
      <div class="empty-icon">◌</div>
      <p>No posts yet. Add the first one.</p>
    </div>
  </div>

  <!-- POST DETAIL PAGE -->
  <div id="post-page" class="page">
    <div class="post-header">
      <button class="back-btn" id="post-back-btn">← Back</button>
      <span class="post-category-tag" id="post-cat-tag"></span>
    </div>
    <article class="post-article" id="post-article">
      <!-- Post content injected here -->
    </article>
  </div>

  <!-- ADD POST MODAL -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2>New Post</h2>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <label>Title
          <input type="text" id="new-post-title" placeholder="Post title..." />
        </label>
        <label>Subtitle / Description
          <input type="text" id="new-post-subtitle" placeholder="Short description..." />
        </label>
        <label>Content <span class="hint">(Markdown-style: use # for headings, * for bullets, **bold**)</span>
          <textarea id="new-post-content" placeholder="Write your content here...&#10;&#10;# Section Heading&#10;* bullet point&#10;**bold text**"></textarea>
        </label>
        <label>Tag / Category Color
          <div class="color-picker" id="color-picker">
            <div class="color-dot selected" data-color="green" style="background:#4ade80" title="Green"></div>
            <div class="color-dot" data-color="blue" style="background:#60a5fa" title="Blue"></div>
            <div class="color-dot" data-color="yellow" style="background:#fbbf24" title="Yellow"></div>
            <div class="color-dot" data-color="red" style="background:#f87171" title="Red"></div>
            <div class="color-dot" data-color="purple" style="background:#c084fc" title="Purple"></div>
            <div class="color-dot" data-color="orange" style="background:#fb923c" title="Orange"></div>
          </div>
        </label>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="modal-cancel">Cancel</button>
        <button class="btn-submit" id="modal-submit">Publish Post</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
